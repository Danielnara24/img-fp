[package]
name = "img-fp"
version = "0.15.1"
edition = "2024"
description = "Finds duplicate and near-duplicate images: re-encoded, resized, cropped, rotated, recoloured or embedded"
authors = ["Danielnara24"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Danielnara24/img-fp"
readme = "README.md"
keywords = ["image", "duplicate", "deduplication", "fingerprint", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
# CLAUDE.md is internal design notes addressed to a coding agent; it is on
# GitHub for contributors and has nothing to say to a crate consumer.
exclude = ["CLAUDE.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
indicatif = "0.17"
image = "0.25"
# The decoder `image` itself uses for PNG, asked directly so that a PNG can be
# read a row at a time into the reduction; see `decode_png_rows`. Kept at the
# version `image` resolves to, so there is one copy of it in the build.
png = "0.18"
jxl-oxide = "0.12.6"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
# Ctrl-C keeps what the analysis has finished; see `interrupt` in main.rs. The
# handler runs on a thread of its own rather than in signal context, so it can
# take a lock and print. "termination" is SIGTERM and SIGHUP as well, as in
# vid-fp.
ctrlc = { version = "3.5", features = ["termination"] }

# One codegen unit and cross-crate inlining. The pipeline is a handful of tight
# loops calling into `image`'s decoders and `rayon`; nothing here changes what
# is computed, only how well it is compiled.
[profile.release]
lto = "fat"
codegen-units = 1

# `--features prof` adds a per-stage CPU-second table to the end of a run. It
# is what a change to a hot loop is aimed with; see `src/prof.rs`. Without it
# the `timed!` macro expands to its own argument, so the shipped binary pays
# nothing for it.
[features]
prof = []
