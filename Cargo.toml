[package]
name = "img-fp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25"
jxl-oxide = "0.12.6"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

# One codegen unit and cross-crate inlining. The pipeline is a handful of tight
# loops calling into `image`'s decoders and `rayon`; nothing here changes what
# is computed, only how well it is compiled.
[profile.release]
lto = "fat"
codegen-units = 1
